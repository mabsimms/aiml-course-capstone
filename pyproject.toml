[project]
name = "capstone"
version = "0.1.0"
description = "Capstone project for AI/ML course"
readme = "README.md"
authors = [
    { name = "Mark Simms", email = "masimms@outlook.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "setuptools>=83.0.0",
    #"tensorflow==2.22.0",
    "tensorflow==2.22.0.dev0+selfbuilt ; sys_platform == 'linux'",
    "tensorflow>=2.18.1,<2.22 ; sys_platform == 'darwin'",
    "tensorflow-metal>=1.2.0 ; sys_platform == 'darwin'",
    "typer>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# Avoid pulling newest packages (supply chain attacks); static value will need to be periodically refreshed
[tool.uv]
exclude-newer = "2026-07-30T00:00:00Z"
find-links = ["/home/masimms/wheels"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
prerelease-package = {
    tensorflow = "allow"
}


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
